{% extends "base.html" %}

{% block content %}

<div class="card">

    <h1>{{ quiz["title"] }}</h1>

    <p>
        {{ quiz["description"] }}
    </p>

</div>


<div class="card" style="text-align: center;">
    <h2>Time Remaining</h2>
    <h1 id="countdown" style="color: red;">Loading...</h1>
</div>

<form method="POST" id="quiz-form">

    {% for question in questions %}

    <div class="card question">

        <h3>
            {{ loop.index }}. {{ question["question"] }}
        </h3>

        <div class="option">

            <label>

                <input type="radio"
                       name="question_{{ question['id'] }}"
                       value="A"
                       required>

                A. {{ question["option_a"] }}

            </label>

        </div>


        <div class="option">

            <label>

                <input type="radio"
                       name="question_{{ question['id'] }}"
                       value="B">

                B. {{ question["option_b"] }}

            </label>

        </div>


        <div class="option">

            <label>

                <input type="radio"
                       name="question_{{ question['id'] }}"
                       value="C">

                C. {{ question["option_c"] }}

            </label>

        </div>


        <div class="option">

            <label>

                <input type="radio"
                       name="question_{{ question['id'] }}"
                       value="D">

                D. {{ question["option_d"] }}

            </label>

        </div>

    </div>

    {% endfor %}


    <button type="submit"
            class="success">

        Submit Quiz

    </button>

</form>
<script>
    let remainingSeconds = {{ remaining_seconds }};
    let timerInterval;

    const countdownDisplay = document.getElementById("countdown");
    const quizForm = document.getElementById("quiz-form");

    function updateCountdown() {
        const minutes = Math.floor(remainingSeconds / 60);
        const seconds = remainingSeconds % 60;

        countdownDisplay.textContent =
            String(minutes).padStart(2, "0") + ":" +
            String(seconds).padStart(2, "0");

        if (remainingSeconds <= 0) {
            clearInterval(timerInterval);
            countdownDisplay.textContent = "Time is up! Submitting...";
            quizForm.submit();
            return;
        }

        remainingSeconds--;
    }

    updateCountdown();
    timerInterval = setInterval(updateCountdown, 1000);
</script>

{% endblock %}
