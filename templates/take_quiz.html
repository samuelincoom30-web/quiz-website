{% extends "base.html" %}

{% block content %}

<div class="card">

    <h1>{{ quiz["title"] }}</h1>

    <p>
        {{ quiz["description"] }}
    </p>

</div>


<form method="POST">

    {% for question in questions %}

    <div class="card question">

        <h3>
            {{ loop.index }}. {{ question["question"] }}
        </h3>

        <div class="option">

            <label>

                <input type="radio"
                       name="question_{{ question['id'] }}"
                       value="A"
                       required>

                A. {{ question["option_a"] }}

            </label>

        </div>


        <div class="option">

            <label>

                <input type="radio"
                       name="question_{{ question['id'] }}"
                       value="B">

                B. {{ question["option_b"] }}

            </label>

        </div>


        <div class="option">

            <label>

                <input type="radio"
                       name="question_{{ question['id'] }}"
                       value="C">

                C. {{ question["option_c"] }}

            </label>

        </div>


        <div class="option">

            <label>

                <input type="radio"
                       name="question_{{ question['id'] }}"
                       value="D">

                D. {{ question["option_d"] }}

            </label>

        </div>

    </div>

    {% endfor %}


    <button type="submit"
            class="success">

        Submit Quiz

    </button>

</form>

{% endblock %}
