{% extends "base.html" %}

{% block content %}
<style>
    .portal-login-wrap {
        max-width: 390px;
        margin: 35px auto;
        padding: 0 14px 30px;
    }

    .portal-login-card {
        padding: 26px;
        background: #18181b;
        color: #e4e4e7;
        border: 1px solid #52525b;
        border-top: 4px solid #d4af37;
        border-radius: 16px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, .2);
    }

    .portal-login-card h2 {
        margin-top: 0;
        color: #e5c76b;
        text-align: center;
    }

    .portal-login-card .login-subtitle {
        color: #c4c4cc;
        text-align: center;
        margin-bottom: 24px;
        line-height: 1.6;
    }

    .portal-login-card label {
        display: block;
        margin: 14px 0 6px;
        color: #e4e4e7;
        font-weight: 700;
    }

    .portal-login-card input {
        display: block;
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
        padding: 11px 12px;
        border: 1px solid #71717a;
        border-radius: 8px;
        background: #09090b;
        color: #fafafa;
        font: inherit;
    }

    .portal-login-card input:focus {
        outline: 2px solid #d4af37;
        border-color: #d4af37;
    }

    .portal-login-card button {
        width: 100%;
        margin-top: 22px;
        padding: 12px;
        border: 0;
        border-radius: 8px;
        background: #d4af37;
        color: #111111;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
    }

    .portal-login-card button:hover {
        background: #f0d56e;
    }

    @media (max-width: 480px) {
        .portal-login-wrap {
            margin-top: 18px;
        }

        .portal-login-card {
            padding: 20px;
        }
    }
</style>

<div class="portal-login-wrap">
    <div class="portal-login-card">
        <h2>Sign In</h2>
        <p class="login-subtitle">
            Enter the account details provided by your school.
        </p>

        <form method="POST">
            <label for="login_username">Username</label>
            <input type="text"
                   id="login_username"
                   name="username"
                   autocomplete="username"
                   required>

            <label for="login_password">Password</label>
            <input type="password"
                   id="login_password"
                   name="password"
                   autocomplete="current-password"
                   required>

            <button type="submit">Sign In</button>
        </form>
    </div>
</div>
{% endblock %}
