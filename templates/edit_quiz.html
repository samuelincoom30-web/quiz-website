{% extends "base.html" %}

{% block content %}

<h1>Edit Quiz</h1>

<form method="POST">

    <label>Quiz Title:</label>
    <br>

    <input
        type="text"
        name="title"
        value="{{ quiz['title'] }}"
        required
    >

    <br><br>

    <label>Description:</label>
    <br>

    <textarea
        name="description"
        rows="5"
        cols="60"
    >{{ quiz['description'] }}</textarea>

    <br><br>

    <button type="submit">
        Save Changes
    </button>

</form>

<br>

<a href="{{ url_for('teacher_dashboard') }}">
    Cancel
</a>

{% endblock %}
